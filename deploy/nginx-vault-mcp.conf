# Vault MCP Server — nginx reverse proxy (TLS termination)
# Save as /etc/nginx/sites-available/vault-mcp.conf and symlink into sites-enabled.
# Replace vault.example.com and the certificate paths with your own.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name vault.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vault.example.com;

    ssl_certificate     /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — only enable once TLS is confirmed working
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Credentials aren't huge; cap the body anyway
    client_max_body_size 256k;

    # The app runs on localhost only (see vault-mcp.service)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The /mcp endpoint streams Server-Sent Events — disable buffering
        # and keep the connection open long enough for idle MCP sessions.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
