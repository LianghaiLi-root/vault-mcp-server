[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-mcp-server"
version = "0.1.0"
description = "Deployable multi-user credential vault with a web console and a remote MCP endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "pyyaml",
    "mcp==1.30.0",
    "sse-starlette",
]

# Optional: renders the image CAPTCHA for the login page.
#   pip install ".[captcha]"
# Without it the numeric/image CAPTCHA modes degrade to an arithmetic question
# instead of failing open. Turnstile needs no extra package.
[project.optional-dependencies]
captcha = ["Pillow>=10"]
# Test suite: pytest tests/            (live endpoint: pytest -m live)
dev = ["pytest>=7.4"]

# Console entry points (available after `pip install .`):
#   vault-mcp-server  -> starts the web + remote MCP server
#   vault-mcp-cli     -> operator CLI (add-user / set-token / list-users)
[project.scripts]
vault-mcp-server = "vault_mcp.server:main"
vault-mcp-cli = "vault_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["vault_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit a real endpoint and need MCP_URL + MCP_TOKEN; keep them out of
# the default run. Enable with: pytest -m live
addopts = '-m "not live"'
markers = [
    "integration: exercises a real subprocess / transport (slower)",
    "live: talks to a deployed endpoint, needs MCP_URL and MCP_TOKEN",
]
