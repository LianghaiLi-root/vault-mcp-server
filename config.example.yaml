# Vault MCP Server — example configuration
# Operator edits this file to provision users. 2FA is enrolled later via the web UI.
# Do NOT commit real password hashes / tokens; generate them on the server with
#   python -m vault_mcp.cli add-user <username>

vault:
  dir: /var/lib/vault-mcp/vault   # encrypted store root (mount a volume here)
  force_pbkdf2: true             # REQUIRED on Linux — no DPAPI available

server:
  host: 0.0.0.0
  port: 8080

# Remote MCP endpoint (/mcp) — DNS-rebinding protection is always ON.
# Whitelist the hostnames you actually expose; a request whose Host header is
# not listed gets HTTP 421. Behind nginx/Cloudflare use the PUBLIC domain.
mcp:
  allowed_hosts:
    - vault.example.com
    - 127.0.0.1:8080
    - localhost:8080
  # allowed_origins:            # optional; defaults to https://<each allowed_host>
  #   - https://vault.example.com

# Optional: restrict the AI-blind vault_http tool to specific hosts.
# http:
#   allow_hosts:
#     - api.github.com

# Optional: web hardening (admin-managed from the console, but may be seeded here).
# `require_cloudflare_access` makes EVERY browser request carry a Cloudflare
# Access JWT (header or CF_Authorization cookie); without it the site 403s.
security:
  require_cloudflare_access: false
  force_secure_cookie: false
  required_edge_header: ""          # e.g. X-Edge-Secret injected by your proxy
  required_edge_header_value: ""
  login_max_failures: 8
  login_lockout_seconds: 300

# Human verification on the login form. Normally you set this from the admin UI
# (运维/用户 → 人机验证) rather than by hand.
captcha:
  # off       no challenge
  # numeric   digits only, rendered as an image
  # image     letters + digits, rendered as an image with noise
  # turnstile Cloudflare Turnstile — REQUIRES both keys below
  mode: "off"
  length: 4                      # glyph count for numeric / image (3-8)
  turnstile_site_key: ""         # Cloudflare dashboard → Turnstile → site key
  turnstile_secret_key: ""       # must be set together with the site key

users:
  # `role` is either `admin` (super-user: manages all accounts) or `user`
  # (ordinary account: sees and edits only itself). An account with no `role`
  # is treated as `user`. Keep exactly one admin — the first one you create.
  - username: admin
    role: admin
    # Generate with: python -m vault_mcp.cli add-user admin --role admin
    password_hash: "REPLACE_WITH_scrypt_hash"
    # Generate with: python -m vault_mcp.cli set-token admin
    mcp_token: "REPLACE_WITH_long_random_token"
    totp_secret: null            # set automatically after 2FA enrollment

  # - username: alice
  #   role: user
  #   password_hash: "REPLACE_WITH_scrypt_hash"
  #   mcp_token: "REPLACE_WITH_long_random_token"
  #   totp_secret: null
